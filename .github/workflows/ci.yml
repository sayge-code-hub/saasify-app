name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-safety:
    name: Migration safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce versioned SQL only
        run: |
          test -d supabase/migrations
          test -n "$(find supabase/migrations -maxdepth 1 -name '*.sql' -print -quit)"
          test -z "$(find supabase -maxdepth 1 -name '*.sql' -print -quit)"
          ! rg -n --glob '*.sql' '^[[:space:]]*(delete[[:space:]]+from|truncate)[[:space:]]' supabase/migrations

  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin the validated SDK so a future stable release cannot turn new
          # analyzer deprecations into an unexpected production outage.
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Fail the gate on analyzer findings (infos/warnings/errors).
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
